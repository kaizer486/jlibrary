---
deployment:
  tasks:
    # Sync application directories
    - /usr/bin/rsync -a --delete app/ /home/jlibrary/public_html/app/
    - /usr/bin/rsync -a --delete bootstrap/ /home/jlibrary/public_html/bootstrap/
    - /usr/bin/rsync -a --delete config/ /home/jlibrary/public_html/config/
    - /usr/bin/rsync -a --delete database/ /home/jlibrary/public_html/database/
    - /usr/bin/rsync -a --delete resources/ /home/jlibrary/public_html/resources/
    - /usr/bin/rsync -a --delete routes/ /home/jlibrary/public_html/routes/
    # Sync public assets
    - /usr/bin/rsync -a public/ /home/jlibrary/public_html/
    # Copy root files
    - /bin/cp artisan /home/jlibrary/public_html
    - /bin/cp composer.json /home/jlibrary/public_html
    - /bin/cp composer.lock /home/jlibrary/public_html
    # Clear Laravel caches
    - /opt/cpanel/ea-php84/root/usr/bin/php /home/jlibrary/public_html/artisan optimize:clear
