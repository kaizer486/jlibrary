---
deployment:
  tasks:
    - export DEPLOYPATH=/home/jlibrary/public_html

    # Copy application directories
    - /bin/cp -R app $DEPLOYPATH
    - /bin/cp -R bootstrap $DEPLOYPATH
    - /bin/cp -R config $DEPLOYPATH
    - /bin/cp -R database $DEPLOYPATH
    - /bin/cp -R public/* $DEPLOYPATH
    - /bin/cp -R resources $DEPLOYPATH
    - /bin/cp -R routes $DEPLOYPATH

    # Copy root files
    - /bin/cp artisan $DEPLOYPATH
    - /bin/cp composer.json $DEPLOYPATH
    - /bin/cp composer.lock $DEPLOYPATH

    # Clear Laravel caches
    - /opt/cpanel/ea-php84/root/usr/bin/php $DEPLOYPATH/artisan config:clear
    - /opt/cpanel/ea-php84/root/usr/bin/php $DEPLOYPATH/artisan route:clear
    - /opt/cpanel/ea-php84/root/usr/bin/php $DEPLOYPATH/artisan view:clear
    - /opt/cpanel/ea-php84/root/usr/bin/php $DEPLOYPATH/artisan cache:clear