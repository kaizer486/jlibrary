---
deployment:
  tasks:
    - export DEPLOYPATH=/home/jlibrary/public_html

    # Sync application directories
    - /usr/bin/rsync -a --delete app/ $DEPLOYPATH/app/
    - /usr/bin/rsync -a --delete bootstrap/ $DEPLOYPATH/bootstrap/
    - /usr/bin/rsync -a --delete config/ $DEPLOYPATH/config/
    - /usr/bin/rsync -a --delete database/ $DEPLOYPATH/database/
    - /usr/bin/rsync -a --delete resources/ $DEPLOYPATH/resources/
    - /usr/bin/rsync -a --delete routes/ $DEPLOYPATH/routes/

    # Sync public assets
    - /usr/bin/rsync -a public/ $DEPLOYPATH/

    # Copy root files
    - /bin/cp artisan $DEPLOYPATH
    - /bin/cp composer.json $DEPLOYPATH
    - /bin/cp composer.lock $DEPLOYPATH

    # Clear Laravel caches
    - /opt/cpanel/ea-php84/root/usr/bin/php $DEPLOYPATH/artisan optimize:clear